  <g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
    <text x="42" y="545.76" font-size="14" fill="#2C2C2A" font-weight="bold" font-style="italic" xml:space="preserve"><tspan font-weight="normal">“I completely understand </tspan>how important it is to feel safe and supported during your weekend <tspan fill="rgb(44">rides.</tspan><tspan font-weight="normal" fill="rgb(44"> </tspan></text>
    <text x="42" y="562.56" font-size="14" fill="rgb(44" font-style="italic" xml:space="preserve">Our comprehensive motor insurance includes third-party, own damage and personal accident cover but</text>
    <text x="42" y="579.36" font-size="14" fill="rgb(44" font-style="italic" xml:space="preserve">also 24/7 roadside assistance. Whether it’s a flat tyre or a breakdown, <tspan font-weight="bold">help is always just a call away</tspan>, </text>
    <text x="42" y="596.16" font-size="14" fill="rgb(44" font-style="italic" xml:space="preserve">we’ve got your back wherever the road takes you.”</text>
  </g>
